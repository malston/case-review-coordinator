[tool.poetry]
name = "case-review-coordinator"
version = "0.1.0"
description = "CCA Domain 5 build exercise: a review coordinator with a persistent case-facts block; a load-bearing Records Service timeout surfaces as a structured error and terminates instead of fabricating 'no prior claims', and conflicting sources are synthesized with provenance."
authors = ["Mark Alston"]
readme = "README.md"
packages = [{include = "case_review", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = ">=2.0"

[tool.poetry.group.live]
optional = true

[tool.poetry.group.live.dependencies]
anthropic = ">=0.42.0"
python-dotenv = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.4"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
